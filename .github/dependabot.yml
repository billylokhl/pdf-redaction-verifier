version: 2
updates:
  # Python dependencies
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    grouped:
      patterns:
        - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    reviewers:
      - billylokhl
    labels:
      - dependencies
    body: |
      Any dependency bump in pyproject.toml needs the full test suite to verify no output changes.

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    grouped:
      patterns:
        - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    reviewers:
      - billylokhl
    labels:
      - ci
