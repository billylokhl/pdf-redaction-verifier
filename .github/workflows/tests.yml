name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Cancel superseded runs on PR branches (each stacks a 10x-billed macOS
# job); runs on main always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Full suite: REQUIRE_FULL_ENV=1 makes conftest.py hard-fail collection
  # if the Vision bridge, exiftool, or qpdf is unavailable — so the
  # environment-gated tests can never silently skip on this job.
  #
  # Split into four parallel shards (owner decisions 2026-10-16: the single job
  # took about 40 of its 50 minutes; smaller jobs fail fast when one hangs).
  # tests/ci_shards.py is the one place the
  # split is defined: shards a-c run explicit lists of files, balanced by
  # measured time; shard "d" runs everything under tests/ except those lists,
  # so a NEW test file lands in "d" by default and cannot go unrun on macOS.
  # tests/test_ci_shards.py asserts the four collections are disjoint and
  # together equal the unsplit one. The job id stays `full-macos`, so
  # `needs.full-macos.result` (and ci-ok) is the aggregate of all four legs: one
  # failed or cancelled leg fails it. No branch protection exists on main
  # (checked 2026-10-16), so no required check name changes; if it is added,
  # require `ci-ok`, not the per-leg names.
  full-macos:
    name: full-macos (shard ${{ matrix.shard }})
    runs-on: macos-latest
    # Each shard takes about SHARD_MINUTES including setup (see CHANGELOG); 25
    # is about 2x that, so a runaway is cut early. Concurrency: a public repo
    # gets 5 concurrent macOS jobs, and one PR run now uses 4 of them; the
    # weekly scorecard job (scorecard-weekly.yml, also macOS) queues behind
    # them, never dropped, for at most about one shard's duration.
    timeout-minutes: 25
    strategy:
      # Let the other shards finish so one run shows every failure.
      fail-fast: false
      matrix:
        shard: [a, b, c, d]
    env:
      REQUIRE_FULL_ENV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install CLI tools
        run: brew install exiftool
      - name: Install qpdf (pinned to pikepdf's libqpdf, 12.4.2)
        # The inventory gate needs the qpdf CLI and pikepdf's libqpdf at one
        # major.minor version (eval/scorecard/inventory.py refuses otherwise):
        # the official release binary, checksum from qpdf's own .sha256.
        # That binary links OpenSSL statically but loads OpenSSL's legacy
        # provider (RC4: 40- to 128-bit encrypted PDFs) at run time from a
        # modules directory fixed when it was built (12.4.2's, per `strings`:
        # /opt/homebrew/Cellar/openssl@3/3.6.4/lib/ossl-modules). When the
        # runner image changes Homebrew's openssl@3, that directory can
        # vanish: qpdf then exits 2 on any RC4 file ("unable to load
        # openssl legacy provider"), which the gate reads as a split on
        # encryption (macos-26-arm64 20261013, openssl@3 3.6.4 -> 3.6.5).
        # verify.py runs qpdf with a stripped environment (PATH and locale
        # only), so OPENSSL_MODULES cannot reach it there: qpdf exited 2 on
        # every RC4-keyed file (R2-R4, AES-128 included). So the directory
        # the binary was built to look in is linked to the installed
        # openssl@3's modules, and this step, not a test, fails if qpdf
        # cannot write and read an RC4 file with an empty environment.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/qpdf.zip" \
            https://github.com/qpdf/qpdf/releases/download/v12.4.2/qpdf-12.4.2-bin-macos-arm64.zip
          echo "62e46987a30ea167cbc530ccb22690aec3d8c812ed09979a941bcee92e504b79  $RUNNER_TEMP/qpdf.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/qpdf.zip" -d "$RUNNER_TEMP/qpdf"
          bin="$(find "$RUNNER_TEMP/qpdf" -type f -name qpdf -perm -u+x | head -1)"
          "$bin" --version
          modules="$(brew --prefix openssl@3)/lib/ossl-modules"
          test -f "$modules/legacy.dylib"
          # awk reads all its input (no early exit to SIGPIPE strings).
          builtin="$(strings "$(dirname "$bin")"/../lib/libqpdf.*.dylib \
            | awk '/^\/.*\/ossl-modules$/ && !f {print; f=1}')"
          echo "built-in modules directory: $builtin"
          test -n "$builtin"
          # This leaves a stub keg for that openssl@3 version in the
          # Cellar; no later step runs brew.
          if [ ! -e "$builtin/legacy.dylib" ]; then
            mkdir -p "$(dirname "$builtin")"
            ln -sfn "$modules" "$builtin"
          fi
          env -i PATH="$PATH" "$bin" --allow-weak-crypto --empty --encrypt \
            --user-password= --owner-password=owner --bits=128 --use-aes=n -- "$RUNNER_TEMP/rc4.pdf"
          env -i PATH="$PATH" "$bin" --is-encrypted "$RUNNER_TEMP/rc4.pdf"
          dirname "$bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        # --locked fails the build if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked --extra test
      - name: Run test suite
        # Case-library grids need no OCR and run on Linux; here they would add
        # OCR time for nothing (their labels hold both ways; a full-env run of
        # the grids is tracked in REDESIGN.md Phase 0c).
        # --timeout=300 per test (pyproject's 900 s default is for local
        # runs): the slowest test takes about 63 s locally, so a hung
        # Vision call fails the shard in 5 minutes, not 15.
        run: uv run pytest $(python tests/ci_shards.py ${{ matrix.shard }}) -rs -m "not grid" --timeout=300 --durations=15

  # Partial suite on Linux across the supported Python range (README
  # promises 3.10+): OCR-dependent tests skip with a reason; the
  # normalizer, text-layer extraction, exit-code contract, and qpdf degradation
  # tests still run. Guards the cross-platform degrade-loudly behavior.
  partial-linux:
    runs-on: ubuntu-latest
    # The 3.12 leg runs under coverage: about 14 min before 3a-7b's page-tree
    # and linearity tests (wall-clock checks at n and 8n), past 15 after,
    # and 24 min on main by 2026-10-15 (the others 8-12), so 25 cancelled
    # it on runner variance; 40 leaves room.
    timeout-minutes: 40
    strategy:
      matrix:
        # qpdf: the release matching each Python's pikepdf pin's libqpdf
        # (pyproject.toml); the inventory gate needs one major.minor version.
        include:
          - python-version: "3.10"
            qpdf: "12.3.2"
            qpdf-sha256: "44f2c53bf784c0143128d80d2b9946e9793962c5bb403b75c0024cb4d8e346b9"
          - python-version: "3.12"
            qpdf: "12.4.2"
            qpdf-sha256: "db367d897829f22c4198ce1094143c9d467bd6ee7dfabc44ba6f02056b24f8b1"
          - python-version: "3.13"
            qpdf: "12.4.2"
            qpdf-sha256: "db367d897829f22c4198ce1094143c9d467bd6ee7dfabc44ba6f02056b24f8b1"
          - python-version: "3.14"
            qpdf: "12.4.2"
            qpdf-sha256: "db367d897829f22c4198ce1094143c9d467bd6ee7dfabc44ba6f02056b24f8b1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install CLI tools
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: Install qpdf (pinned to pikepdf's libqpdf)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/qpdf.zip" \
            "https://github.com/qpdf/qpdf/releases/download/v${{ matrix.qpdf }}/qpdf-${{ matrix.qpdf }}-bin-linux-x86_64.zip"
          echo "${{ matrix.qpdf-sha256 }}  $RUNNER_TEMP/qpdf.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/qpdf.zip" -d "$RUNNER_TEMP/qpdf"
          bin="$(find "$RUNNER_TEMP/qpdf" -type f -name qpdf -perm -u+x | head -1)"
          "$bin" --version
          dirname "$bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: uv sync --locked --extra test
      - name: Run test suite
        # One run per version; 3.12 also reports coverage.
        # COVERAGE_CORE=sysmon (3.12 leg only): coverage's default C tracer
        # (sys.settrace) made this leg ~3x slower than the same run without
        # coverage (measured locally: 37.6 min vs 11.2 min); the sys.monitoring
        # core (PEP 669; line coverage only, which is all we measure) takes
        # 13.1 min. Totals match (sysmon sees a few more lines, where tests
        # set their own settrace). Branch coverage would need Python 3.14
        # under sysmon; do not enable it here.
        env:
          COVERAGE_CORE: ${{ matrix.python-version == '3.12' && 'sysmon' || '' }}
        run: >-
          uv run pytest tests/ -rs
          ${{ matrix.python-version == '3.12' && '--cov=verify --cov=caselib --cov=redaction_verifier --cov-report=term' || '' }}

  # Scorecard differential (docs/REDESIGN.md §5, Phase 0c): the case
  # library, run through the real CLI as a subprocess per file and
  # compared against the pinned eval-ref-0 tag. No OCR here (same as
  # partial-linux), so requires: ocr cases are skipped automatically;
  # their reference-vs-candidate agreement is exercised by the scheduled
  # full-environment job instead. Fails on any crash, timeout, or
  # difference not listed in eval/accepted_diffs.yaml.
  scorecard-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need the full history to resolve eval-ref-0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install CLI tools
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl qpdf
      - name: Install Python dependencies
        run: uv sync --locked --extra test
      # The reference (eval-ref-0) almost never changes, so its results
      # are cached across runs keyed by the case library's build lock;
      # scorecard.differential.reference_cache_key also folds in the
      # resolved commit, so a re-tagged eval-ref-0 invalidates itself.
      - name: Cache scorecard reference results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: eval/scorecard/.reference-cache
          # Also keyed by the scorecard's own source, so this action
          # restores a fresh (empty) cache directory the moment the
          # comparison logic changes — belt and braces alongside
          # scorecard.differential.reference_cache_key's own code hash,
          # which is what actually decides whether a given entry is
          # trusted once this directory is restored.
          key: scorecard-ref-${{ hashFiles('eval/caselib/cases.lock.json', 'eval/scorecard/*.py') }}
          restore-keys: scorecard-ref-
      - name: Run scorecard differential
        run: >-
          PYTHONPATH=eval:. uv run python -m scorecard diff
          --cache-dir eval/scorecard/.reference-cache
          --json scorecard-diff.json --verbose
      - name: Upload scorecard diff report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-diff
          path: scorecard-diff.json
          if-no-files-found: ignore

  # Linting: ruff and mypy on Python 3.12
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python dependencies
        # ruff and mypy come from the pinned `dev` dependency group, not an
        # ad hoc unpinned install, so a new tool release can't change what
        # "clean" means out from under a PR.
        run: uv sync --locked --extra test --group dev
      - name: Run ruff
        run: uv run ruff check .
      - name: Run mypy
        run: uv run mypy

  # A "may only shrink" list or a red-team round's frozen label anchor can
  # be edited in the very same commit as the test that checks it — that
  # test only ever sees one checkout, so it can't catch a list and its own
  # guard moving together. This job diffs against a different commit (the
  # PR's merge-base with main, or HEAD~1 on a direct push) instead;
  # eval/check_ratchets.py documents exactly what that does and does not
  # catch. Needs the full history a normal shallow checkout doesn't have.
  ratchets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run ratchet checks
        run: python eval/check_ratchets.py

  # The gallery (docs/REDESIGN.md Phase 0e): built from the case library and
  # uploaded as an artifact so a reviewer can browse it, but it never gates
  # anything — continue-on-error and left out of ci-ok's needs. Cheap on
  # purpose: Linux has no OCR bridge, and this build doesn't run the
  # scorecard first, so every case shows its label ("not measured this
  # run") rather than a measured verdict.
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python dependencies
        run: uv sync --locked --extra test
      - name: Build the gallery
        run: PYTHONPATH=eval:. uv run python -m gallery build --out gallery-build
      - name: Upload gallery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery
          path: gallery-build
          if-no-files-found: ignore

  # Single stable check name to mark as required once branch protection
  # becomes available for this repo. `if: always()` plus an explicit
  # result check, rather than relying on the default "skip if a
  # dependency failed": a skipped job can read as passing to some branch
  # protection setups, which would let a failed scorecard-diff (or any
  # other needed job) through silently.
  # `needs.full-macos.result` covers all four macOS shards (a matrix job reports
  # one aggregate result: failure/cancelled if any leg did).
  ci-ok:
    needs: [full-macos, partial-linux, scorecard-diff, lint, ratchets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job above to have succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "one or more required jobs did not succeed:"
            echo '${{ toJson(needs) }}'
            exit 1
          fi
          echo "all required jobs succeeded"
