name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Cancel superseded runs on PR branches (each stacks a 10x-billed macOS
# job); runs on main always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Full suite: REQUIRE_FULL_ENV=1 makes conftest.py hard-fail collection
  # if the Vision bridge, exiftool, or qpdf is unavailable — so the
  # environment-gated tests can never silently skip on this job.
  full-macos:
    runs-on: macos-latest
    # The case library OCRs ~100 generated PDFs: about 9 minutes here.
    timeout-minutes: 25
    env:
      REQUIRE_FULL_ENV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CLI tools
        run: brew install exiftool qpdf
      - name: Install Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Run test suite
        # Case-library grids need no OCR and run on Linux; here they would add
        # OCR time for nothing (their labels hold both ways; a full-env run of
        # the grids is tracked in REDESIGN.md Phase 0c).
        run: python -m pytest tests/ -rs -m "not grid"

  # Partial suite on Linux across the supported Python range (README
  # promises 3.10+): OCR-dependent tests skip with a reason; the
  # normalizer, text-layer extraction, exit-code contract, and qpdf degradation
  # tests still run. Guards the cross-platform degrade-loudly behavior.
  partial-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CLI tools
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl qpdf
      - name: Install Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Run test suite
        # One run per version; 3.12 also reports coverage.
        run: >-
          python -m pytest tests/ -rs
          ${{ matrix.python-version == '3.12' && '--cov=verify --cov=caselib --cov-report=term' || '' }}

  # Scorecard differential (docs/REDESIGN.md §5, Phase 0c): the case
  # library, run through the real CLI as a subprocess per file and
  # compared against the pinned eval-ref-0 tag. No OCR here (same as
  # partial-linux), so requires: ocr cases are skipped automatically;
  # their reference-vs-candidate agreement is exercised by the scheduled
  # full-environment job instead. Fails on any crash, timeout, or
  # difference not listed in eval/accepted_diffs.yaml.
  scorecard-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need the full history to resolve eval-ref-0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CLI tools
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl qpdf
      - name: Install Python dependencies
        run: python -m pip install -e '.[test]'
      # The reference (eval-ref-0) almost never changes, so its results
      # are cached across runs keyed by the case library's build lock;
      # scorecard.differential.reference_cache_key also folds in the
      # resolved commit, so a re-tagged eval-ref-0 invalidates itself.
      - name: Cache scorecard reference results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: eval/scorecard/.reference-cache
          # Also keyed by the scorecard's own source, so this action
          # restores a fresh (empty) cache directory the moment the
          # comparison logic changes — belt and braces alongside
          # scorecard.differential.reference_cache_key's own code hash,
          # which is what actually decides whether a given entry is
          # trusted once this directory is restored.
          key: scorecard-ref-${{ hashFiles('eval/caselib/cases.lock.json', 'eval/scorecard/*.py') }}
          restore-keys: scorecard-ref-
      - name: Run scorecard differential
        run: >-
          PYTHONPATH=eval:. python -m scorecard diff
          --cache-dir eval/scorecard/.reference-cache
          --json scorecard-diff.json --verbose
      - name: Upload scorecard diff report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-diff
          path: scorecard-diff.json
          if-no-files-found: ignore

  # Linting: ruff and mypy on Python 3.12
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Install lint tools
        run: python -m pip install ruff mypy
      - name: Run ruff
        run: ruff check .
      - name: Run mypy
        run: mypy

  # A "may only shrink" list or a red-team round's frozen label anchor can
  # be edited in the very same commit as the test that checks it — that
  # test only ever sees one checkout, so it can't catch a list and its own
  # guard moving together. This job diffs against a different commit (the
  # PR's merge-base with main, or HEAD~1 on a direct push) instead;
  # eval/check_ratchets.py documents exactly what that does and does not
  # catch. Needs the full history a normal shallow checkout doesn't have.
  ratchets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run ratchet checks
        run: python eval/check_ratchets.py

  # Single stable check name to mark as required once branch protection
  # becomes available for this repo. `if: always()` plus an explicit
  # result check, rather than relying on the default "skip if a
  # dependency failed": a skipped job can read as passing to some branch
  # protection setups, which would let a failed scorecard-diff (or any
  # other needed job) through silently.
  ci-ok:
    needs: [full-macos, partial-linux, scorecard-diff, lint, ratchets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job above to have succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "one or more required jobs did not succeed:"
            echo '${{ toJson(needs) }}'
            exit 1
          fi
          echo "all required jobs succeeded"
