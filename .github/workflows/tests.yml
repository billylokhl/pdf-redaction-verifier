name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Cancel superseded runs on PR branches (each stacks a 10x-billed macOS
# job); runs on main always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Full suite: REQUIRE_FULL_ENV=1 makes conftest.py hard-fail collection
  # if the Vision bridge, exiftool, or qpdf is unavailable — so the
  # environment-gated tests can never silently skip on this job.
  full-macos:
    runs-on: macos-latest
    # The case library OCRs ~100 generated PDFs: about 9 minutes here.
    timeout-minutes: 25
    env:
      REQUIRE_FULL_ENV: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install CLI tools
        run: brew install exiftool qpdf
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt && python -m pip install --no-deps -e .
      - name: Run test suite
        # Case-library grids need no OCR and run on Linux; here they would add
        # OCR time for nothing (their labels hold both ways; a full-env run of
        # the grids is tracked in REDESIGN.md Phase 0c).
        run: python -m pytest tests/ -rs -m "not grid"

  # Partial suite on Linux across the supported Python range (README
  # promises 3.10+): OCR-dependent tests skip with a reason; the
  # normalizer, text-layer extraction, exit-code contract, and qpdf degradation
  # tests still run. Guards the cross-platform degrade-loudly behavior.
  partial-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install CLI tools
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl qpdf
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt && python -m pip install --no-deps -e .
      - name: Run test suite
        run: python -m pytest tests/ -rs
      - name: Coverage report (3.12 only)
        if: matrix.python-version == '3.12'
        run: python -m pytest tests/ --cov=verify --cov=caselib --cov-report=term

  # Linting: ruff and mypy on Python 3.12
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt && python -m pip install --no-deps -e .
      - name: Install lint tools
        run: python -m pip install ruff mypy
      - name: Run ruff
        run: ruff check .
      - name: Run mypy
        run: mypy

  # Single stable check name to mark as required once branch protection
  # becomes available for this repo.
  ci-ok:
    needs: [full-macos, partial-linux, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "all test jobs passed"
