name: scorecard-weekly

# Weekly, full-environment coverage that every PR skips for cost
# (docs/REDESIGN.md §5, "Where each gate runs"): the case library
# including its parameter grids, on macOS with Apple Vision OCR, both as
# pytest's judge (so a grid's OCR-free labels are checked to still hold
# with OCR present — full-macos in tests.yml excludes the grid marker
# entirely) and as the scorecard differential against eval-ref-0 (so
# OCR-touching cases are compared too, not just the OCR-free subset
# scorecard-diff runs on every PR).
on:
  schedule:
    - cron: "17 6 * * 1"   # Monday 06:17 UTC — an arbitrary off-peak time
  workflow_dispatch: {}

# One queue per branch: a workflow-wide group lets a newer dispatch on
# another branch replace (cancel) a pending one, and branches use this
# run as their pre-merge macOS+OCR gate (#147).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-environment-scorecard:
    runs-on: macos-latest
    # The job-level limit only stops a runaway run; the per-file timeout
    # (60 s) is what gates. Measured on this runner (3 cores, 7 GB, OCR
    # on the CPU) at one scan per core (`--workers`' default): 34.6 min
    # in all — pytest 12.4, scorecard diff (reference + candidate) 14.9,
    # metrics 6.8. The two runs before that default were cancelled at
    # the old 45-minute limit, their scorecard steps slowed by
    # oversubscription. By 2026-10-15 a run took 58-62 min (main's
    # 38735403761: 58 min), so 60 cancelled runs mid-way; 120 leaves room.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      REQUIRE_FULL_ENV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need the full history to resolve eval-ref-0
          fetch-tags: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install CLI tools
        run: brew install exiftool qpdf
      - name: Install Python dependencies
        run: uv sync --locked --extra test
      - name: Run the full case library, grids included, with OCR
        # test_policy1_cases.py's scan-based check (every class-rule case
        # outside the owner's sign-off list keeps its exit in default mode)
        # needs OCR and the grids; full-macos runs `-m "not grid"`.
        run: uv run pytest tests/test_case_library.py tests/test_policy1_cases.py -rs
      - name: Run the scorecard differential, grids included, with OCR
        run: >-
          PYTHONPATH=eval:. uv run python -m scorecard diff
          --json scorecard-diff-full.json --verbose
      - name: Run the scorecard metrics table
        # Fails on any case with no verdict: crash, timeout or error report
        # (it still writes its JSON).
        if: always()
        run: >-
          PYTHONPATH=eval:. uv run python -m scorecard metrics
          --json scorecard-metrics-full.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scorecard-full-environment
          path: |
            scorecard-diff-full.json
            scorecard-metrics-full.json
          if-no-files-found: ignore
