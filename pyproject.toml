[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-redaction-verifier"
# Single source of truth: verify.__version__ (also printed by --version
# and recorded in every --json report).
dynamic = ["version"]
description = "Forensic CLI that detects sensitive strings and pattern classes inside a PDF across text, OCR, metadata, object, binary-stream and hidden-object layers"
readme = "README.md"
requires-python = ">=3.10"

# Pinned for reproducibility: this is a verification tool whose verdict
# gates releases, so a silent upstream change must not change a verdict.
dependencies = [
    "pymupdf==1.28.2",
    # Reading a redactor's redact_config.yaml as a shared rules file.
    "pyyaml==6.0.3",
    # Apple Vision OCR bridge. The marker is the whole point: these are
    # required on macOS (without them the OCR layer degrades and the run
    # exits 2, never a certified clean) and impossible anywhere else, so
    # the platform split is declared here instead of living in a second
    # requirements file someone has to remember to install.
    # Cocoa is listed explicitly because verify.py imports Foundation
    # directly rather than relying on a transitive pull.
    "pyobjc-framework-Vision==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-cov==7.1.0"]

[dependency-groups]
# Lint tools, pinned exact like everything else here: CI's lint job
# installs from these instead of an unpinned `pip install ruff mypy`, so a
# new tool release can't change what "clean" means out from under a PR.
dev = ["ruff==0.16.9", "mypy==2.3.1"]

[project.scripts]
pdf-verify = "verify:run_cli"

[tool.setuptools]
py-modules = ["verify"]

[tool.setuptools.dynamic]
version = {attr = "verify.__version__"}

[tool.uv]
# Pin the uv binary itself, not just the lock: a different uv version can
# resolve or install differently even against the same uv.lock. CI's
# setup-uv steps pass a matching `version:`; this makes a local uv refuse
# to run at all if it doesn't match, rather than silently drifting.
required-version = ">=0.12.3,<0.13"
# requires-python is an open-ended ">=3.10"; without a cap uv's universal
# resolver would also have to solve for not-yet-released interpreters.
# The lock only needs to cover what CI and the README actually promise
# (3.10 through 3.13).
required-environments = [
    "python_version >= '3.10' and python_version < '3.14' and sys_platform == 'darwin'",
    "python_version >= '3.10' and python_version < '3.14' and sys_platform == 'linux'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# eval/ holds the case library (import caselib), which the tests judge.
pythonpath = [".", "eval"]

[tool.coverage.run]
# The CLI tests run verify.py as a subprocess; pytest-cov 7 no longer
# measures subprocesses unless coverage is told to patch them.
patch = ["subprocess"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]
per-file-ignores = {}

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["eval/caselib", "eval/scorecard", "eval/check_ratchets.py", "eval/gallery"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "verify"
ignore_errors = true
