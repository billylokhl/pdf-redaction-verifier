- case: page.raw-font-coded-runs-off-overhanging-crop
  old:
    exit: 0
    error: null
    findings: []
    warnings: []
  new:
    exit: 1
    error: null
    findings:
    - - - SSN
        - hard
        - live
      - 1
    warnings: []
  reason: 'PR #68: the Text layer gains readings across the visible edge (the crop box ∩ the
    media box): every glyph of one writing direction, visible or not, read together. A font-coded
    value that starts on the page and runs off it, which the visible and the off-page readings
    each held only in part, is now read whole and found hard; its font codes keep the Objects
    layer''s literal scan from reading it, so the reference (eval-ref-0) exited 0. Stricter
    only.'
  cell: off-page.font.straddling
  pr: '#68'
