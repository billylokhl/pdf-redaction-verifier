- case: leftover.deleted-page-embedded-font-compact
  old:
    exit: 0
    error: null
    findings: []
    warnings: []
  new:
    exit: 2
    error: null
    findings: []
    warnings:
    - - - LEFTOVER_UNDECODABLE_TEXT
        - Objects
        - null
      - 1
  reason: 'K8 fix (4c2af1e, then generalised by c5342ff): the leftover-content tokenizer used
    to require whitespace around BT/Tf/ET and matched leftover text with windowed regexes.
    It now tokenizes a content stream the way a PDF parser does (delimiter- and NUL-aware,
    no whitespace required), so compactly written operators ("BT/F1 11 Tf"), long text objects,
    a font set before BT, kerned one-glyph-per-Tj strings, and compact inline images are recognised
    as page content instead of silently passing as unreadable binary. The reference tool (eval-ref-0)
    never read these bytes at all and exited 0; the candidate reads them, cannot decode the
    text with confidence, and reports the leftover coverage warning under Objects (exit 2)
    instead. This holds regardless of environment: the key drops OCR_UNAVAILABLE/TOOL_MISSING
    and recomputes the exit without them, so a Linux (no-OCR) run and a full-environment run
    normalise to the same before/after pair.'
  cell: orphaned.font.compact-syntax
  pr: '#13'
